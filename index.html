<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mapa de Empreendimentos</title>
    <!-- Biblioteca do mapa (Leaflet + Leaflet.markercluster): arquivos LOCAIS,
     instalados via NPM e servidos pelo proprio Express (/vendor/leaflet e
     /vendor/leaflet.markercluster) -- NENHUM script/CSS e carregado de CDN
     externo. Isso evita o erro "Nao foi possivel carregar a biblioteca do
     mapa", comum em redes corporativas que bloqueiam dominios de CDN. -->
    <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
    <link
      rel="stylesheet"
      href="/vendor/leaflet.markercluster/MarkerCluster.css"
    />
    <link
      rel="stylesheet"
      href="/vendor/leaflet.markercluster/MarkerCluster.Default.css"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <div class="topbar">
      <div class="brand"><span class="dot"></span> Mapa de Empreendimentos</div>
      <button class="topbarLogout" id="logoutBtn" type="button" title="Sair">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
        <span>Sair</span>
      </button>
    </div>

    <div class="page">
      <!-- ===== MAPA: abre direto (fonte fixa: predio_caixao / geom) ===== -->
      <div id="mapView">
        <div class="mapWrap">
          <div class="mapSidebar">
            <div>
              <h3>Filtros</h3>
              <div class="mapFilterField">
                <label>Name</label
                ><input id="mapFilterName" placeholder="Buscar por nome..." />
              </div>
              <div class="mapFilterField">
                <label>Destinação</label
                ><select id="mapFilterDestinacao">
                  <option value="">Todas</option>
                </select>
              </div>
              <div class="mapFilterField">
                <label>Empreendimentos</label
                ><select id="mapFilterLayer">
                  <option value="">Todas</option>
                </select>
              </div>
              <button
                class="btn btn-secondary"
                id="mapClearFiltersBtn"
                style="width: 100%"
              >
                Limpar filtros
              </button>
            </div>
            <div>
              <h3>Estatisticas</h3>
              <div class="mapStatsGrid" id="mapStatsGrid">
                <div class="mapStatChip">
                  <div class="val" id="mapStatTotal">-</div>
                  <div class="lbl">Total</div>
                </div>
              </div>
            </div>
          </div>
          <div class="mapMain">
            <div
              id="mapCanvas"
              role="application"
              aria-label="Mapa interativo"
            ></div>
            <div class="mapToolbar">
              <div class="mapSearchBox">
                <span aria-hidden="true">&#128269;</span>
                <input
                  id="mapGeocodeInput"
                  placeholder="Buscar endereco ou local..."
                  aria-label="Buscar endereco"
                />
              </div>
              <div
                class="mapLayerSwitcher"
                id="mapLayerSwitcher"
                role="group"
                aria-label="Camada do mapa"
              ></div>
            </div>
            <div class="mapCtrlGroup">
              <button
                class="mapCtrlBtn"
                id="mapZoomInBtn"
                title="Aumentar zoom"
                aria-label="Aumentar zoom"
              >
                +
              </button>
              <button
                class="mapCtrlBtn"
                id="mapZoomOutBtn"
                title="Diminuir zoom"
                aria-label="Diminuir zoom"
              >
                &minus;
              </button>
              <button
                class="mapCtrlBtn"
                id="mapLocateBtn"
                title="Minha localizacao"
                aria-label="Minha localizacao"
              >
                &#128205;
              </button>
              <button
                class="mapCtrlBtn"
                id="mapResetBtn"
                title="Centralizar resultados"
                aria-label="Centralizar resultados"
              >
                &#8635;
              </button>
              <button
                class="mapCtrlBtn"
                id="mapFullscreenBtn"
                title="Tela cheia"
                aria-label="Tela cheia"
              >
                &#9974;
              </button>
            </div>
            <div class="mapLegend" id="mapLegend">
              <strong style="font-size: 11px">Legenda</strong>
            </div>
            <div class="mapCoordReadout" id="mapCoordReadout"></div>
            <div class="mapOverlayState hidden" id="mapLoadingState">
              <div class="spinner"></div>
              <p class="small">Carregando registros...</p>
            </div>
            <div class="mapOverlayState hidden" id="mapErrorState">
              <p id="mapErrorMsg">Nao foi possivel carregar o mapa.</p>
              <button class="btn btn-primary" id="mapRetryBtn">
                Tentar novamente
              </button>
            </div>
            <div class="mapOverlayState hidden" id="mapEmptyState">
              <p>Nenhum registro encontrado para os filtros selecionados.</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="toastRoot"></div>

    <script src="/vendor/leaflet/leaflet.js"></script>
    <script src="/vendor/leaflet.markercluster/leaflet.markercluster.js"></script>

    <script src="./js/script.js"></script>
  </body>
</html>
